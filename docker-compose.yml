services:
  backend:
    build:
      context: ./backend
    container_name: face-detection-backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/roi.db
      FRAMES_DIR: ./data/frames
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: face-detection-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
